<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020b14">
  <meta name="description" content="いちみず会関連サイトへのビジュアルポータル">
  <title>いちみず会ポータル｜関連サイト案内</title>
  <style>
    :root {
      --bg: #020b14;
      --cyan: rgba(72, 214, 255, .92);
      --red: rgba(255, 75, 75, .92);
      --label-bg: rgba(0, 8, 16, .82);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      overflow-x: hidden;
    }

    .map {
      position: relative;
      line-height: 0;
      background: #00101d;
      box-shadow: 0 0 70px rgba(0,0,0,.55);
    }

    .map img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .desktop-map {
      width: min(100vw, 177.68vh);
    }

    .mobile-map {
      width: min(100vw, 56.28vh);
      display: none;
    }

    .hotspot {
      position: absolute;
      display: block;
      z-index: 2;
      border-radius: 18px;
      outline: 1px solid transparent;
      -webkit-tap-highlight-color: transparent;
      transition:
        background-color .16s ease,
        box-shadow .16s ease,
        outline-color .16s ease,
        transform .16s ease;
    }

    .hotspot::after {
      content: attr(data-label);
      position: absolute;
      left: 50%;
      bottom: .55rem;
      transform: translate(-50%, 8px);
      opacity: 0;
      line-height: 1;
      white-space: nowrap;
      color: #fff;
      font-size: clamp(10px, 1vw, 15px);
      font-weight: 700;
      padding: .5em .72em;
      border-radius: 999px;
      background: var(--label-bg);
      border: 1px solid rgba(255,255,255,.22);
      backdrop-filter: blur(8px);
      pointer-events: none;
      transition: .16s ease;
    }

    .hotspot:hover,
    .hotspot:focus-visible {
      background: rgba(255,255,255,.05);
      outline-color: rgba(255,255,255,.35);
      transform: translateY(-1px);
    }

    .hotspot:hover::after,
    .hotspot:focus-visible::after {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .hotspot.blue:hover,
    .hotspot.blue:focus-visible {
      box-shadow: inset 0 0 0 2px var(--cyan), 0 0 24px rgba(72,214,255,.28);
    }

    .hotspot.red:hover,
    .hotspot.red:focus-visible {
      box-shadow: inset 0 0 0 2px var(--red), 0 0 24px rgba(255,75,75,.24);
    }

    /* Desktop: coordinates are percentages of the 1672×941 image */
    .desktop-map .ichimizu { left: 3.8%; top: 10.4%; width: 29.3%; height: 44.8%; }
    .desktop-map .hub      { left: 34.9%; top: 10.2%; width: 29.2%; height: 45.0%; }
    .desktop-map .overseas { left: 66.0%; top: 10.6%; width: 29.5%; height: 45.0%; }
    .desktop-map .daily    { left: 2.4%; top: 60.3%; width: 22.4%; height: 34.8%; }
    .desktop-map .portal   { left: 36.4%; top: 58.5%; width: 27.0%; height: 35.2%; }
    .desktop-map .stats    { left: 75.8%; top: 60.3%; width: 21.7%; height: 34.8%; }

    /* Mobile: coordinates are percentages of the 941×1672 image */
    .mobile-map .portal   { left: 22.5%; top: 8.5%;  width: 53.5%; height: 20.8%; }
    .mobile-map .ichimizu { left: 23.0%; top: 29.0%; width: 52.5%; height: 18.7%; }
    .mobile-map .hub      { left: 23.0%; top: 47.1%; width: 52.5%; height: 16.6%; }
    .mobile-map .overseas { left: 23.0%; top: 63.8%; width: 52.5%; height: 16.5%; }
    .mobile-map .daily    { left: 4.5%;  top: 80.0%; width: 43.5%; height: 19.2%; }
    .mobile-map .stats    { left: 52.0%; top: 80.0%; width: 43.5%; height: 19.2%; }

    .hint {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      color: rgba(255,255,255,.9);
      background: rgba(1,10,18,.76);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      padding: .68em .95em;
      font-size: clamp(11px, 1.1vw, 14px);
      line-height: 1;
      backdrop-filter: blur(10px);
      pointer-events: none;
      animation: fadeHint .7s ease 4s forwards;
    }

    @keyframes fadeHint {
      to { opacity: 0; transform: translate(-50%, 8px); }
    }

    @media (max-width: 760px), (orientation: portrait) {
      body { align-items: start; }
      .desktop-map { display: none; }
      .mobile-map { display: block; }
      .hotspot { border-radius: 14px; }
      .hotspot::after { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hotspot, .hotspot::after, .hint {
        transition: none;
        animation: none;
      }
    }
  </style>
</head>
<body>

  <!-- PC / 横画面 -->
  <main class="map desktop-map" aria-label="いちみず会関連サイト ポータルマップ（PC版）">
    <img src="assets/portal-desktop.png" alt="いちみず会関連サイトのポータル画像">

    <a class="hotspot red ichimizu"
       href="https://sites.google.com/view/ichimizu-crime-prevention/home"
       target="_blank" rel="noopener noreferrer"
       aria-label="いちみず会HPを開く" data-label="いちみず会HP"></a>

    <a class="hotspot blue hub"
       href="https://ebp2ichimizu-cell.github.io/ichimizu-research-hub-github/#/"
       target="_blank" rel="noopener noreferrer"
       aria-label="研究ハブを開く" data-label="研究ハブ"></a>

    <a class="hotspot blue overseas"
       href="https://ebp2ichimizu-cell.github.io/overseas-ebp-jp-nav/#/"
       target="_blank" rel="noopener noreferrer"
       aria-label="海外EBPナビを開く" data-label="海外EBPナビ"></a>

    <a class="hotspot red daily"
       href="https://ebp-daily-brief.grassy-wasp-8750.chatgpt.site/"
       target="_blank" rel="noopener noreferrer"
       aria-label="Daily Briefを開く" data-label="Daily Brief"></a>

    <a class="hotspot blue portal"
       href="https://ebp2ichimizu-cell.github.io/Ichimizu-portal/"
       target="_blank" rel="noopener noreferrer"
       aria-label="いちみず会ポータルを開く" data-label="いちみず会ポータル"></a>

    <a class="hotspot red stats"
       href="https://ebp-stat-training.grassy-wasp-8750.chatgpt.site/"
       target="_blank" rel="noopener noreferrer"
       aria-label="統計演習を開く" data-label="統計演習"></a>
  </main>

  <!-- スマホ / 縦画面 -->
  <main class="map mobile-map" aria-label="いちみず会関連サイト ポータルマップ（スマホ版）">
    <img src="assets/portal-mobile.png" alt="いちみず会関連サイトのスマホ向けポータル画像">

    <a class="hotspot blue portal"
       href="https://ebp2ichimizu-cell.github.io/Ichimizu-portal/"
       target="_blank" rel="noopener noreferrer"
       aria-label="いちみず会ポータルを開く" data-label="いちみず会ポータル"></a>

    <a class="hotspot red ichimizu"
       href="https://sites.google.com/view/ichimizu-crime-prevention/home"
       target="_blank" rel="noopener noreferrer"
       aria-label="いちみず会HPを開く" data-label="いちみず会HP"></a>

    <a class="hotspot blue hub"
       href="https://ebp2ichimizu-cell.github.io/ichimizu-research-hub-github/#/"
       target="_blank" rel="noopener noreferrer"
       aria-label="研究ハブを開く" data-label="研究ハブ"></a>

    <a class="hotspot blue overseas"
       href="https://overseas-ebp-jp-nav.grassy-wasp-8750.chatgpt.site/"
       target="_blank" rel="noopener noreferrer"
       aria-label="海外EBPナビを開く" data-label="海外EBPナビ"></a>

    <a class="hotspot red daily"
       href="https://ebp-daily-brief.grassy-wasp-8750.chatgpt.site/"
       target="_blank" rel="noopener noreferrer"
       aria-label="Daily Briefを開く" data-label="Daily Brief"></a>

    <a class="hotspot red stats"
       href="https://ebp-stat-training.grassy-wasp-8750.chatgpt.site/"
       target="_blank" rel="noopener noreferrer"
       aria-label="統計演習を開く" data-label="統計演習"></a>
  </main>

  <div class="hint">画像内のサイトをクリック／タップ</div>
</body>
</html>
