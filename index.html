<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>いちみず会 ポータルマップ</title>
<meta name="description" content="いちみず会関連サイトを画像から選べるポータルページ">
<style>
  :root{
    --bg:#020b14;
    --cyan:rgba(61,208,255,.90);
    --red:rgba(255,72,72,.92);
    --text:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
  body{
    display:grid;
    place-items:center;
    min-height:100dvh;
    padding:0;
    overflow-x:hidden;
  }
  .stage{
    position:relative;
    width:min(100vw,177.68vh);
    line-height:0;
    background:#00101d;
    box-shadow:0 0 70px rgba(0,0,0,.55);
  }
  .stage img{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
  }
  .hotspot{
    position:absolute;
    display:block;
    z-index:2;
    border-radius:1.2rem;
    outline:1px solid transparent;
    transition:
      background-color .18s ease,
      box-shadow .18s ease,
      outline-color .18s ease,
      transform .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .hotspot::after{
    content:attr(data-label);
    position:absolute;
    left:50%;
    bottom:.55rem;
    transform:translate(-50%,8px);
    opacity:0;
    line-height:1;
    white-space:nowrap;
    color:#fff;
    font-size:clamp(10px,1.0vw,15px);
    font-weight:700;
    letter-spacing:.02em;
    padding:.48em .72em;
    border-radius:999px;
    background:rgba(0,8,16,.82);
    border:1px solid rgba(255,255,255,.22);
    backdrop-filter:blur(8px);
    pointer-events:none;
    transition:.18s ease;
  }
  .hotspot:hover,
  .hotspot:focus-visible{
    background:rgba(255,255,255,.055);
    outline-color:rgba(255,255,255,.38);
    transform:translateY(-1px);
  }
  .hotspot:hover::after,
  .hotspot:focus-visible::after{
    opacity:1;
    transform:translate(-50%,0);
  }
  .hotspot.blue:hover,
  .hotspot.blue:focus-visible{
    box-shadow:inset 0 0 0 2px var(--cyan),0 0 24px rgba(61,208,255,.28);
  }
  .hotspot.red:hover,
  .hotspot.red:focus-visible{
    box-shadow:inset 0 0 0 2px var(--red),0 0 24px rgba(255,72,72,.24);
  }

  /* 座標は画像（1672×941）に対する割合 */
  .ichimizu {left:3.8%; top:10.4%; width:29.3%; height:44.8%;}
  .hub      {left:34.9%; top:10.2%; width:29.2%; height:45.0%;}
  .overseas {left:66.0%; top:10.6%; width:29.5%; height:45.0%;}
  .daily    {left:2.4%; top:60.3%; width:22.4%; height:34.8%;}
  .portal   {left:36.4%; top:58.5%; width:27.0%; height:35.2%;}
  .stats    {left:75.8%; top:60.3%; width:21.7%; height:34.8%;}

  .hint{
    position:fixed;
    z-index:20;
    left:50%;
    bottom:max(14px,env(safe-area-inset-bottom));
    transform:translateX(-50%);
    color:rgba(255,255,255,.88);
    background:rgba(1,10,18,.72);
    border:1px solid rgba(255,255,255,.20);
    border-radius:999px;
    padding:.72em 1em;
    font-size:clamp(11px,1.2vw,15px);
    line-height:1;
    backdrop-filter:blur(10px);
    animation:fadeHint .7s ease 4s forwards;
    pointer-events:none;
  }
  @keyframes fadeHint{to{opacity:0;transform:translate(-50%,8px)}}
  @media (prefers-reduced-motion:reduce){
    .hotspot,.hotspot::after,.hint{transition:none;animation:none}
  }
</style>
</head>
<body>
<main class="stage" aria-label="いちみず会関連サイト ポータルマップ">
  <img src="ichimizu_portal_map.png" alt="いちみず会関連サイトを一覧化したポータル画像">

  <a class="hotspot red ichimizu"
     href="https://sites.google.com/view/ichimizu-crime-prevention/home"
     target="_blank" rel="noopener noreferrer"
     aria-label="いちみず会HPを開く" data-label="いちみず会HP"></a>

  <a class="hotspot blue hub"
     href="https://ebp2ichimizu-cell.github.io/ichimizu-research-hub-github/#/"
     target="_blank" rel="noopener noreferrer"
     aria-label="研究ハブを開く" data-label="研究ハブ"></a>

  <a class="hotspot blue overseas"
     href="https://overseas-ebp-jp-nav.grassy-wasp-8750.chatgpt.site/"
     target="_blank" rel="noopener noreferrer"
     aria-label="海外EBPナビを開く" data-label="海外EBPナビ"></a>

  <a class="hotspot red daily"
     href="https://ebp-daily-brief.grassy-wasp-8750.chatgpt.site/"
     target="_blank" rel="noopener noreferrer"
     aria-label="Daily Briefを開く" data-label="Daily Brief"></a>

  <a class="hotspot blue portal"
     href="https://ebp2ichimizu-cell.github.io/Ichimizu-portal/"
     target="_blank" rel="noopener noreferrer"
     aria-label="いちみず会ポータルを開く" data-label="いちみず会ポータル"></a>

  <a class="hotspot red stats"
     href="https://ebp-stat-training.grassy-wasp-8750.chatgpt.site/"
     target="_blank" rel="noopener noreferrer"
     aria-label="統計演習を開く" data-label="統計演習"></a>
</main>

<div class="hint">画像内のサイトをクリック／タップ</div>
</body>
</html>
